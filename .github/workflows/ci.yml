name: CI
on:
  push:
    branches:
      - main
  pull_request:
  workflow_dispatch:
jobs:
  test:
    name: test (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
    steps:
      - uses: actions/checkout@v4
      - name: Install uv and set the python version
        uses: astral-sh/setup-uv@v5
        with:
          python-version: "3.11"
          enable-cache: true
          cache-dependency-glob: pyproject.toml
      - name: install project
        run: uv sync --all-extras --dev
      - name: pytest
        env:
          OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
          URSA_SBX: 0
        run: uv run pytest --durations=0
  installer:
    name: installed (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os:
          - ubuntu-latest
          - macos-latest
          - windows-latest
    steps:
      - name: Test Windows installer
        if: runner.os == 'Windows'
        shell: powershell
        env:
          INSTALL_URL: https://raw.githubusercontent.com/lanl/ursa/${{ github.sha }}/install.ps1
        run: |
          powershell.exe -NoProfile -ExecutionPolicy Bypass -Command `
            "irm $env:INSTALL_URL | iex"
      - name: Test Unix installer
        if: runner.os != 'Windows'
        shell: bash
        env:
          INSTALL_URL: https://raw.githubusercontent.com/lanl/ursa/${{ github.sha }}/install.sh
        run: |
          curl -LsSf "$INSTALL_URL" | sh
