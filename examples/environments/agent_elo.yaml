name: harmonic_oscillator_elo
group: default

description: >
  Evolutionary URSA environment for training neural-network variational
  wavefunctions for the one-dimensional quantum harmonic oscillator.

initial_rating: 1500
k_factor: 32
deaths_per_round: 1

judge_prompt: >
  You are judging two competing computational-physics agents solving
  the one-dimensional quantum harmonic oscillator with a neural-network
  variational wavefunction.

  The Hamiltonian is

      H = -1/2 d^2/dx^2 + 1/2 x^2

  in units with hbar = m = omega = 1, so the exact ground-state energy is

      E0 = 0.5.

  Prioritize:
  - whether the candidate actually created and executed code;
  - correctness of the Hamiltonian and variational-energy calculation;
  - accuracy of the final ground-state energy relative to 0.5;
  - numerical normalization of the wavefunction;
  - evidence that optimization actually occurred;
  - comparison of the learned wavefunction with the exact Gaussian
    ground-state wavefunction;
  - numerical stability and scientific correctness;
  - reproducibility of code and results.

  A candidate that only describes a method but does not execute the
  calculation should lose to a candidate with a valid executed calculation,
  unless the executed calculation is fundamentally incorrect.

  Do not reward verbosity, stylistic polish, or unnecessary complexity.

  Return DRAW only if the candidates are genuinely comparable in scientific
  and computational quality.

members:
  - name: researcher_1
    role: >
      Independent computational physicist developing and testing a neural
