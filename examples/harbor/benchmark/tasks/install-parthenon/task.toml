schema_version = "1.4"
[task]
name = "ursa/install-parthenon"
version = "1.0.0"
description = "Build and install the Parthenon scientific software framework."
authors = [{ name = "URSA Developers" }]
keywords = ["cmake", "package-installation", "scientific-computing"]

[metadata]
author_name = "URSA Developers"
author_email = "ursa@lanl.gov"
difficulty = "hard"
category = "software_engineering"
